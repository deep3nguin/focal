name: Build iOS IPA & Release

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.1.app || true

      - name: Verify Concurrency Compliance
        run: |
          swift build -Xswiftc -strict-concurrency=complete

      - name: Run Unit & Integration Tests
        run: |
          swift test

      - name: Build Release Bundle & IPA
        run: |
          swift build -c release
          mkdir -p build/Payload
          find .build -name "*.app" -exec cp -r {} build/Payload/ \; 2>/dev/null || cp -r .build/release/* build/Payload/ 2>/dev/null || true
          cd build && zip -r Focal.ipa Payload && cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Focal Release v1.0.${{ github.run_number }}
          body: |
            Automated iOS release build for Focal.
            - Concurrency checks passed (`-strict-concurrency=complete`).
            - Unit & integration tests passed.
            - Modular Swift 6 Architecture (Domain, Data, AIKit, TimerKit, DesignSystem, Presentation).
          files: build/Focal.ipa
          token: ${{ secrets.GITHUB_TOKEN }}
